<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Party Together</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" />
      <strong>Party Together</strong>
      <button id="settings-button" type="button" aria-label="Configurar endereço">⚙</button>
    </header>
    <form id="url-form" hidden>
      <label for="app-url">Endereço do app publicado</label>
      <div class="url-row">
        <input id="app-url" type="url" placeholder="https://seu-dominio.com" required />
        <button type="submit">Abrir</button>
      </div>
      <p id="form-error" role="status"></p>
    </form>
    <div id="empty-state" hidden>
      <p>Informe a URL publicada do Party Together para abrir o app neste painel.</p>
    </div>
    <iframe id="app-frame" title="Party Together" allow="autoplay; encrypted-media; clipboard-write" hidden></iframe>
    <footer id="open-link" hidden>
      <a id="open-tab" target="_blank" rel="noopener noreferrer">Abrir em uma aba</a>
      <button id="change-url" type="button">Trocar endereço</button>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
